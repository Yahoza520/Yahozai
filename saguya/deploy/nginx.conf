# Saguya Health — Hostinger VPS için nginx ters vekil (reverse proxy) yapılandırması
#
# Kullanım:
#   1) Bu dosyayı sunucuda şuraya koyun:
#        /etc/nginx/sites-available/saguya
#   2) Etkinleştirin:
#        sudo ln -s /etc/nginx/sites-available/saguya /etc/nginx/sites-enabled/
#   3) server_name satırındaki alan adını kendi alan adınızla değiştirin.
#   4) Test edip yeniden yükleyin:
#        sudo nginx -t && sudo systemctl reload nginx
#   5) SSL (https) için:
#        sudo certbot --nginx -d saguya.com -d www.saguya.com
#
# Next.js uygulaması 127.0.0.1:3000 portunda (systemd servisi) çalışır.

server {
    listen 80;
    listen [::]:80;

    # ↓↓↓ Kendi alan adınızla değiştirin ↓↓↓
    server_name saguya.com www.saguya.com;

    # Yükleme boyutu (ileride belge yükleme için makul bir üst sınır)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js statik dosyaları için önbellek
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
